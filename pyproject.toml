[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snom-liver"
version = "0.1.0"
description = "SNOM near-field spectroscopy preprocessing, baseline classification, and clean physics inversion."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "h5py",
  "openpyxl",
  "torch",
]

[tool.setuptools.packages.find]
where = ["src"]
